# API Gateway (Ocelot, port 5000) — build, test, scan, push ghcr.io/<owner>/erp-gateway, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · gateway

on:
  push:
    branches: [master]
    paths:
      - src/Gateway/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.Gateway.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-gateway.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/Gateway/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.Gateway.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-gateway.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: gateway
      service-path: src/Gateway/Ocelot.API
      project-file: Ocelot.API.csproj
      assembly-name: Ocelot.API
      unit-test-project: tests/unit/ERP.Gateway.UnitTests/ERP.Gateway.UnitTests.csproj
      k8s-deployment: gateway
      k8s-container: gateway
