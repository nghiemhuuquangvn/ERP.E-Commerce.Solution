# PaymentService (5009, PAY) — build, test, scan, push ghcr.io/<owner>/erp-payment, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · payment

on:
  push:
    branches: [master]
    paths:
      - src/services/PaymentService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.PAY.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-payment.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/PaymentService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.PAY.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-payment.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-payment-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: payment
      service-path: src/services/PaymentService/src/ERP.PAY.API
      project-file: ERP.PAY.API.csproj
      assembly-name: ERP.PAY.API
      unit-test-project: tests/unit/ERP.PAY.UnitTests/ERP.PAY.UnitTests.csproj
      k8s-deployment: payment-service
      k8s-container: payment-service
