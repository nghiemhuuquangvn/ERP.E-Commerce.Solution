# LoggingService (5016, LOG) — build, test, scan, push ghcr.io/<owner>/erp-logging, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · logging

on:
  push:
    branches: [master]
    paths:
      - src/services/LoggingService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-logging.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/LoggingService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-logging.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-logging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: logging
      service-path: src/services/LoggingService/src/ERP.LOG.API
      project-file: ERP.LOG.API.csproj
      assembly-name: ERP.LOG.API
      k8s-deployment: logging-service
      k8s-container: logging-service
