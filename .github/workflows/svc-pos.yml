# POSService (5011, POS) — build, test, scan, push ghcr.io/<owner>/erp-pos, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · pos

on:
  push:
    branches: [master]
    paths:
      - src/services/POSService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.POS.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-pos.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/POSService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.POS.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-pos.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-pos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: pos
      service-path: src/services/POSService/src/ERP.POS.API
      project-file: ERP.POS.API.csproj
      assembly-name: ERP.POS.API
      unit-test-project: tests/unit/ERP.POS.UnitTests/ERP.POS.UnitTests.csproj
      k8s-deployment: pos-service
      k8s-container: pos-service
