# IdentityService (5001) — build, test, scan, push ghcr.io/<owner>/erp-identity, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · identity

on:
  push:
    branches: [master]
    paths:
      - src/services/IdentityService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.Identity.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-identity.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/IdentityService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.Identity.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-identity.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-identity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: identity
      service-path: src/services/IdentityService/src/ERP.Identity.Api
      project-file: ERP.Identity.API.csproj
      assembly-name: ERP.Identity.API
      unit-test-project: tests/unit/ERP.Identity.UnitTests/ERP.Identity.UnitTests.csproj
      k8s-deployment: identity-service
      k8s-container: identity-service
