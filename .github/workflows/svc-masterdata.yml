# SharedMasterDataService (5015, MST) — build, test, scan, push ghcr.io/<owner>/erp-masterdata, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · masterdata

on:
  push:
    branches: [master]
    paths:
      - src/services/SharedMasterDataService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.MST.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-masterdata.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/SharedMasterDataService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.MST.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-masterdata.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-masterdata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: masterdata
      service-path: src/services/SharedMasterDataService/src/ERP.MST.API
      project-file: ERP.MST.API.csproj
      assembly-name: ERP.MST.API
      unit-test-project: tests/unit/ERP.MST.UnitTests/ERP.MST.UnitTests.csproj
      k8s-deployment: masterdata-service
      k8s-container: masterdata-service
