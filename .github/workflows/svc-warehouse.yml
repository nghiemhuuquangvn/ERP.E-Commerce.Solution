# WareHouseService (5004) — build, test, scan, push ghcr.io/<owner>/erp-warehouse, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · warehouse

on:
  push:
    branches: [master]
    paths:
      - src/services/WareHouseService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.WH.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-warehouse.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/WareHouseService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.WH.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-warehouse.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-warehouse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: warehouse
      service-path: src/services/WareHouseService/src/ERP.WH.API
      project-file: ERP.WH.API.csproj
      assembly-name: ERP.WH.API
      unit-test-project: tests/unit/ERP.WH.UnitTests/ERP.WH.UnitTests.csproj
      k8s-deployment: warehouse-service
      k8s-container: warehouse-service
