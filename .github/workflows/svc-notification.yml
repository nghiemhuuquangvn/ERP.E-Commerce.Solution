# NotificationService (5013, NTF) — build, test, scan, push ghcr.io/<owner>/erp-notification, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · notification

on:
  push:
    branches: [master]
    paths:
      - src/services/NotificationService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.NTF.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-notification.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/NotificationService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.NTF.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-notification.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-notification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: notification
      service-path: src/services/NotificationService/src/ERP.NTF.API
      project-file: ERP.NTF.API.csproj
      assembly-name: ERP.NTF.API
      unit-test-project: tests/unit/ERP.NTF.UnitTests/ERP.NTF.UnitTests.csproj
      k8s-deployment: notification-service
      k8s-container: notification-service
