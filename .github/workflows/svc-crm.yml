# CRMService (5006, CRM) — build, test, scan, push ghcr.io/<owner>/erp-crm, deploy to K8s.
# Logic lives in _dotnet-service.yml; this file only says WHAT to build and WHEN.
# Values match docker-compose.yml (build args) and deployment/k8s/deployments (names).
name: svc · crm

on:
  push:
    branches: [master]
    paths:
      - src/services/CRMService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.CRM.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-crm.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  pull_request:
    branches: [master]
    paths:
      - src/services/CRMService/**
      - src/Shared/**   # every service references ERP.Shared.* -> a Shared change re-tests all services
      - tests/unit/ERP.CRM.UnitTests/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/svc-crm.yml
      - .github/workflows/_dotnet-service.yml
      - .github/actions/k8s-rollout/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: svc-crm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    secrets: inherit
    with:
      service: crm
      service-path: src/services/CRMService/src/ERP.CRM.API
      project-file: ERP.CRM.API.csproj
      assembly-name: ERP.CRM.API
      unit-test-project: tests/unit/ERP.CRM.UnitTests/ERP.CRM.UnitTests.csproj
      k8s-deployment: crm-service
      k8s-container: crm-service
