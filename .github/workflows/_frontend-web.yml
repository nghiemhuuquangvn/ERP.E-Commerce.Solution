# ════════════════════════════════════════════════════════════════════════════════
# Reusable pipeline for a web SPA (src/frontend/admin, src/frontend/storefront).
# Called by web-admin.yml / web-storefront.yml.
#
#   quality (tokens, lint, Vitest + axe, build) ──► image ──► deploy-staging / deploy-production
#
# The SPA image is environment-neutral: nginx's docker-entrypoint.sh fills the API address at
# container start, so the SAME image moves from staging to production. See docs/deployment/ci-cd.md.
# ════════════════════════════════════════════════════════════════════════════════
name: _frontend-web

on:
  workflow_call:
    inputs:
      app:
        description: Folder under src/frontend (admin | storefront); image erp-<app>
        type: string
        required: true
      install-command:
        description: Dependency install command
        type: string
        default: npm ci
      run-lint:
        description: Run `npm run lint` (needs an eslint.config.js in the app)
        type: boolean
        default: false
      k8s-deployment:
        type: string
        required: true
      k8s-container:
        type: string
        required: true
      deploy-production:
        description: Roll out to the production environment (set only by release.yml, on a v* tag, in release order)
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  K8S_NAMESPACE: erp

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/${{ inputs.app }}/package-lock.json

      - name: Install
        run: ${{ inputs.install-command }}

      # Colours must come from docs/frontend/design-system/tokens/tokens.json (no hex in app code).
      - name: Design tokens are up to date
        run: npm run check:tokens

      - name: Lint
        if: inputs.run-lint
        run: npm run lint

      - name: Unit + accessibility tests (Vitest + axe)
        run: npm test

      - name: Type-check and build
        run: npm run build

  image:
    name: Image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Variables
        id: vars
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/erp-${{ inputs.app }}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the image built for this commit (release tag only)
        id: promote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          src="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}"
          if docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
            docker buildx imagetools create -t "${{ steps.vars.outputs.image }}:${GITHUB_REF_NAME}" "$src"
            digest="$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image for ${{ steps.vars.outputs.sha_tag }} yet - building it."
          fi

      - name: Tags and labels
        if: steps.promote.outputs.promoted != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local, for the scan)
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/build-push-action@v7
        with:
          context: src/frontend/${{ inputs.app }}
          load: true
          push: false
          tags: scan/erp-${{ inputs.app }}:${{ github.sha }}
          cache-from: type=gha,scope=web-${{ inputs.app }}
          cache-to: type=gha,scope=web-${{ inputs.app }},mode=max

      - name: Vulnerability scan (Trivy)
        if: steps.promote.outputs.promoted != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/erp-${{ inputs.app }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push
        id: push
        if: steps.promote.outputs.promoted != 'true' && steps.vars.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: src/frontend/${{ inputs.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=web-${{ inputs.app }}

      - name: Result
        id: result
        run: |
          digest="${{ steps.promote.outputs.digest || steps.push.outputs.digest }}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${{ inputs.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.vars.outputs.image }}@${digest:-'(not pushed)'}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy staging
    needs: image
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && vars.K8S_DEPLOY_ENABLED == 'true' && needs.image.outputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    concurrency:
      group: deploy-staging-web-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/k8s-rollout
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
          namespace: ${{ env.K8S_NAMESPACE }}
          deployment: ${{ inputs.k8s-deployment }}
          container: ${{ inputs.k8s-container }}
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          change-cause: ci ${{ github.sha }} run ${{ github.run_id }}

  deploy-production:
    name: Deploy production
    needs: image
    if: >
      inputs.deploy-production && startsWith(github.ref, 'refs/tags/v')
      && vars.K8S_DEPLOY_ENABLED == 'true' && needs.image.outputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    concurrency:
      group: deploy-production-web-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/k8s-rollout
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          namespace: ${{ env.K8S_NAMESPACE }}
          deployment: ${{ inputs.k8s-deployment }}
          container: ${{ inputs.k8s-container }}
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          change-cause: release ${{ github.ref_name }} (${{ github.sha }})
          timeout: 300s
