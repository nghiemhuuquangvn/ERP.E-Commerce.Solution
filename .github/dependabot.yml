# Weekly dependency update PRs. Each PR runs the normal pipelines (svc-*, web-*, mobile, ci-platform),
# so an update is merged only when the tests of what it touches pass. See docs/deployment/ci-cd.md §10.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }

  # One .sln at the root: Dependabot walks every .csproj it references.
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*']
        update-types: [minor, patch]
      tests:
        patterns: ['xunit*', 'Moq', 'FluentAssertions', 'coverlet*', 'Microsoft.NET.Test.Sdk']

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    # Every project targets net10.0: a new .NET MAJOR image (aspnet:11.0 cannot run a net10.0 app) is an upgrade done by
    # hand together with the TargetFramework, never a bot PR (it broke every image on 2026-11-17).
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/frontend/admin
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /src/frontend/storefront
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  # Expo pins React Native and native modules to its SDK: only patches here, SDK upgrades by hand (npx expo install --fix).
  - package-ecosystem: npm
    directories: [/src/frontend/mobile/admin, /src/frontend/mobile/customer, /src/frontend/mobile/staff]
    schedule: { interval: weekly, day: monday }
    groups:
      patches: { update-types: [patch] }
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major, version-update:semver-minor]
