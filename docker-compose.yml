      KafkaSettings__BootstrapServers: kafka:9092
      Elasticsearch__Uri: http://elasticsearch:9200
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
