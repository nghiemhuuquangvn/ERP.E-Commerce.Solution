      - erp-network

  # ── Frontend ────────────────────────────────────────────────────────────────

  admin:
    image: erp/admin:latest
    build:
      context: src/frontend/admin
      dockerfile: Dockerfile
    container_name: erp-admin
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - erp-network

  storefront:
    image: erp/storefront:latest
    build:
      context: src/frontend/storefront
      dockerfile: Dockerfile
    container_name: erp-storefront
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - erp-network

  # ── Domain Reverse Proxy ────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin
      - storefront
      - gateway
    restart: unless-stopped
    networks:
      - erp-network

