    container_name: erp-notification-service
    environment:
      ASPNETCORE_URLS: "http://+:5013"
      ASPNETCORE_ENVIRONMENT: Production
      # Encrypts one-time secrets in messages / settings (SecretEnvelope). Identity and notification MUST share the value.
      Security__SettingsEncryptionKey: "${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env (see .env.example)}"
      ConnectionStrings__NotificationDb: "Server=${SQL_HOST:-sqlserver},1433;Database=NotificationDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
