      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/IdentityService/src/ERP.Identity.Api
        PROJECT_FILE: ERP.Identity.API.csproj
        ASSEMBLY_NAME: ERP.Identity.API
    container_name: erp-identity-service
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDB: "Server=host.docker.internal,1433;Database=AuthDB;User Id=sa;Password=!Edw@rd!123456!;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
      Cache__InstanceName: "identity"
      KafkaSettings__BootstrapServers: kafka:9092
      Jwt__Key: "ERP_Identity_JWT_Signing_Secret_Key_Minimum_256_Bits_Required"
      Jwt__Expired: "60"
      Jwt__RefreshTokenExpirationDays: "7"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erp-network

