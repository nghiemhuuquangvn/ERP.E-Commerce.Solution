      ConnectionStrings__WarehouseDB: "Server=${SQL_HOST:-sqlserver},1433;Database=WarehouseDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
