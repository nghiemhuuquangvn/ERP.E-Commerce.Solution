  storefront:
    build:
      context: src/frontend/storefront
      dockerfile: Dockerfile
    container_name: erp-storefront
    ports:
      - "3001:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - erp-network

  # ── Domain Reverse Proxy ────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin
      - storefront
      - gateway
      - rabbitmq
      - kafka-ui
    restart: unless-stopped
    networks:
      - erp-network

# ── Volumes & Networks ────────────────────────────────────────────────────────

volumes:
  rabbitmq_data:
    driver: local
  kafka_data:
    driver: local

networks:
  erp-network:
    driver: bridge
    name: erp-network
