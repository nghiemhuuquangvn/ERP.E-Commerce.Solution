      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
      Cache__InstanceName: "po"
      # Tokens are validated with IdentityService's public keys (JWKS, internal http).
      Jwt__Authority: "http://identityservice:5001"
      Jwt__RequireHttpsMetadata: "false"
      RabbitMQ__HostName: rabbitmq
