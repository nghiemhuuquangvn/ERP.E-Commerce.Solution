      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: admin
      RabbitMQ__Password: Admin123
      KafkaSettings__BootstrapServers: kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
