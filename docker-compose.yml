      ServiceAuth__Name: "promotion"
      ServiceAuth__TrustedCallers__salesorder: "http://salesorderservice:5002/internal/jwks.json"
      ConnectionStrings__PromotionDb: "Server=${SQL_HOST:-sqlserver},1433;Database=PromotionDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
