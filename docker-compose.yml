version: '3.9'

# ════════════════════════════════════════════════════════════════════════════════
# ERP E-Commerce Platform — Full Docker Compose
# SQL Server: "sqlserver" container below (self-contained — no host-installed SQL
#             Server needed). sa / ${SA_PASSWORD}. "db-migrate" applies every
#             service's src/Database/**/*.sql migration file once sqlserver is
#             healthy — see deployment/docker/README.md.
# Domains  : erp.local | shop.erp.local | api.erp.local | rabbit.erp.local | kafka.erp.local
# Run      : docker compose up --build -d
# ════════════════════════════════════════════════════════════════════════════════

x-sql-base: &sql-base "Server=${SQL_HOST:-sqlserver},1433;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-sqlserver
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: applies deployment/sql/init-databases.sql + every service's
  # src/Database/{Service}/*.sql migration (numeric filename order) against
  # "sqlserver" using its own bundled sqlcmd, then exits. Re-run anytime with
  # `docker compose up db-migrate` -- every migration file here is written
  # idempotent (IF NOT EXISTS guards), matching this repo's own migration
  # governance convention (see docs/architecture/database-performance-indexing-review.md §9).
  db-migrate:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-db-migrate
    entrypoint: ["/bin/bash", "/migrations/run-migrations.sh"]
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      SQL_HOST: ${SQL_HOST:-sqlserver}
    volumes:
      - ./deployment/sql:/migrations/init:ro
      - ./src/Database:/migrations/database:ro
      - ./deployment/docker/run-migrations.sh:/migrations/run-migrations.sh:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - erp-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: erp-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: erp-elasticsearch
    hostname: elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: erp-azurite
    hostname: azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data"
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite_data:/data
    restart: unless-stopped
    networks:
      - erp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: erp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erp-network

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: erp/gateway:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/Gateway/Ocelot.API
        PROJECT_FILE: Ocelot.API.csproj
        ASSEMBLY_NAME: Ocelot.API
    container_name: erp-gateway
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: Production
      # Service-to-service tokens: signed with this service's own key (in-memory, single
      # replica). Receivers fetch the public key from /internal/jwks.json.
      ServiceAuth__Name: "gateway"
      ServiceAuth__SigningKeys__Source: "Ephemeral"
      # Shared token revocation store (logout/lock/permission changes take effect at once).
      ConnectionStrings__Redis: "redis:6379"
      # Hops whose X-Forwarded-For the rate limiter believes (nginx, the SPA nginx containers).
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      ForwardedHeaders__KnownNetworks__1: "192.168.0.0/16"
      ForwardedHeaders__KnownNetworks__2: "10.0.0.0/8"
      # Tokens are validated with IdentityService's public keys (JWKS, internal http).
      Jwt__Authority: "http://identityservice:5001"
      Jwt__RequireHttpsMetadata: "false"
      KafkaSettings__BootstrapServers: kafka:9092
    depends_on:
      - rabbitmq
      - kafka
    restart: unless-stopped
    networks:
      - erp-network

  # ── Backend Services ────────────────────────────────────────────────────────

  identityservice:
    image: erp/identity-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/IdentityService/src/ERP.Identity.Api
        PROJECT_FILE: ERP.Identity.API.csproj
        ASSEMBLY_NAME: ERP.Identity.API
    container_name: erp-identity-service
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ASPNETCORE_ENVIRONMENT: Production
      # Encrypts one-time secrets in messages / settings (SecretEnvelope). Identity and notification MUST share the value.
      Security__SettingsEncryptionKey: "${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY in .env (see .env.example)}"
      # /internal endpoints accept only these services' tokens (verified with their JWKS).
      ServiceAuth__Name: "identity"
      ServiceAuth__TrustedCallers__gateway: "http://gateway:5000/internal/jwks.json"
      ServiceAuth__TrustedCallers__chatbot: "http://chatbotservice:5017/internal/jwks.json"
      Jwt__RequireHttpsMetadata: "false"
      ConnectionStrings__AuthDB: "Server=${SQL_HOST:-sqlserver},1433;Database=AuthDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
      Cache__InstanceName: "identity"
      KafkaSettings__BootstrapServers: kafka:9092
      # RS256 signing + RSA-OAEP encryption certificates (private keys only here). Local
      # stack: PFX files generated once on the identity_signing volume; production uses Key
      # Vault (docs/business/Identity/SigningKeys.md). No symmetric token key exists.
      SigningKeys__Source: "File"
      SigningKeys__File__Path: "/app/signing/identity-signing.pfx"
      SigningKeys__File__AutoCreate: "true"
      EncryptionKeys__Source: "File"
      EncryptionKeys__File__Path: "/app/signing/identity-encryption.pfx"
      EncryptionKeys__File__AutoCreate: "true"
      Jwt__Expired: "60"
      Jwt__RefreshTokenExpirationDays: "7"
      # Only these senders may set the client IP via X-Forwarded-For (nginx → gateway on
      # erp-network); everything else is taken from the TCP peer address.
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      ForwardedHeaders__KnownNetworks__1: "192.168.0.0/16"
      ForwardedHeaders__KnownNetworks__2: "10.0.0.0/8"
      # Tenant = request host. Local stack is reached via http://localhost (no tenant
      # host), so fall back to SYSTEM. NEVER set FallbackTenantCode in a real multi-tenant
      # deployment — every unknown host would become that tenant.
      Tenancy__BaseDomain: "erp.local"
      Tenancy__StorefrontBaseDomain: "shop.erp.local"
      Tenancy__PlatformHost: "admin.erp.local"
      Tenancy__FallbackTenantCode: "SYSTEM"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      # Token signing/encryption certificates — must survive container re-creation, or
      # every re-deploy rotates the keys and invalidates every issued token.
      - identity_signing:/app/signing
    restart: unless-stopped
    networks:
      - erp-network

  salesorderservice:
    image: erp/salesorder-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/SaleOrderService/src/ERP.SO.Api
        PROJECT_FILE: ERP.SO.Api.csproj
        ASSEMBLY_NAME: ERP.SO.Api
    container_name: erp-salesorder-service
