  chatbotservice:
    image: erp/chatbot-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/ChatBotService/src/ERP.CHB.API
        PROJECT_FILE: ERP.CHB.API.csproj
        ASSEMBLY_NAME: ERP.CHB.API
    container_name: erp-chatbot-service
    # No published port: ChatHub is reached same-origin through the SPA containers'
    # nginx (/hubs/chat -> chatbotservice:5017), REST through the Gateway. For local
    # debugging use docker-compose.debug.yml.
    environment:
      ASPNETCORE_URLS: "http://+:5017"
      ASPNETCORE_ENVIRONMENT: Production
      # Service-to-service tokens: signed with this service's own key (in-memory, single
      # replica). Receivers fetch the public key from /internal/jwks.json.
      ServiceAuth__Name: "chatbot"
      ServiceAuth__SigningKeys__Source: "Ephemeral"
      # Shared token revocation store (logout/lock/permission changes take effect at once).
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__ChatBotDb: "Server=${SQL_HOST:-sqlserver},1433;Database=ChatBotDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      # Tokens are validated with IdentityService's public keys (JWKS, internal http).
      Jwt__Authority: "http://identityservice:5001"
      Jwt__RequireHttpsMetadata: "false"
      Gateway__BaseUrl: "http://gateway:5000"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY}"
      OpenAi__ApiKey: "${OPENAI_API_KEY}"
      ChatBotSettings__StorefrontModel: "claude-haiku-4-5"
      ChatBotSettings__AdminModel: "claude-sonnet-5"
      ChatBotSettings__FreeModel: "gpt-4o-mini"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - erp-network

  reportingservice:
    image: erp/reporting-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/ReportingService/src/ERP.RPT.API
