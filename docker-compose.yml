version: '3.9'

# ════════════════════════════════════════════════════════════════════════════════
# ERP E-Commerce Platform — Full Docker Compose
# SQL Server: host machine (host.docker.internal:1433)  sa / !Edw@rd!123456!
# Domains  : erp.local | shop.erp.local | api.erp.local | rabbit.erp.local | kafka.erp.local
# Run      : docker compose up --build -d
# ════════════════════════════════════════════════════════════════════════════════

x-sql-base: &sql-base "Server=host.docker.internal,1433;User Id=sa;Password=!Edw@rd!123456!;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: erp-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: erp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erp-network

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/Gateway/Ocelot.API
        PROJECT_FILE: Ocelot.API.csproj
        ASSEMBLY_NAME: Ocelot.API
    container_name: erp-gateway
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - erp-network

  # ── Backend Services ────────────────────────────────────────────────────────

  identityservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/IdentityService/src/ERP.Identity.Api
        PROJECT_FILE: ERP.Identity.API.csproj
        ASSEMBLY_NAME: ERP.Identity.API
    container_name: erp-identity-service
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDB: "Server=host.docker.internal,1433;Database=AuthDB;User Id=sa;Password=!Edw@rd!123456!;TrustServerCertificate=True;Encrypt=False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - erp-network

  salesorderservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
