      ServiceAuth__Name: "salesorder"
      ServiceAuth__SigningKeys__Source: "Ephemeral"
      Services__WarehouseServiceBaseUrl: "http://warehouseservice:5004"
      Services__PromotionServiceBaseUrl: "http://promotionservice:5012"
      ConnectionStrings__SalesDb: "Server=${SQL_HOST:-sqlserver},1433;Database=SalesDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
      Cache__InstanceName: "so"
      # Tokens are validated with IdentityService's public keys (JWKS, internal http).
      Jwt__Authority: "http://identityservice:5001"
      Jwt__RequireHttpsMetadata: "false"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: admin
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      KafkaSettings__BootstrapServers: kafka:9092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
