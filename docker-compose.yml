  paymentservice:
    image: erp/payment-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: src/services/PaymentService/src/ERP.PAY.API
        PROJECT_FILE: ERP.PAY.API.csproj
        ASSEMBLY_NAME: ERP.PAY.API
    container_name: erp-payment-service
    environment:
      ASPNETCORE_URLS: "http://+:5009"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PaymentDb: "Server=${SQL_HOST:-sqlserver},1433;Database=PaymentDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      Cache__Type: "Redis"
      Cache__InstanceName: "pay"
      # Tokens are validated with IdentityService's public keys (JWKS, internal http).
      Jwt__Authority: "http://identityservice:5001"
      Jwt__RequireHttpsMetadata: "false"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: admin
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      KafkaSettings__BootstrapServers: kafka:9092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erp-network

