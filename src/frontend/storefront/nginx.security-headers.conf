# Browser security headers (security review 2026-11, S4a, SEC-M14; docs/architecture/browser-security.md).
# Identical copy in admin/ and storefront/ (each image is built from its own folder) - BrowserSecurityHeadersTests keeps
# them equal. Included in the server block of nginx.docker.conf; a location that sets its own add_header must include
# this file again (nginx drops inherited add_header lines there).
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Popups of Google / Microsoft sign-in must be able to answer the opener.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content-Security-Policy - REPORT-ONLY for now (owner decision 2026-11-18): the browser reports violations in the console
# without blocking. After a clean walk through the apps, enforce it by renaming the header to "Content-Security-Policy".
# HSTS is set by the TLS ingress, never here (this nginx also serves the plain-http local stack).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https: http://localhost:10000; font-src 'self' data:; connect-src 'self' ws: wss: https://login.microsoftonline.com https://graph.facebook.com https://accounts.google.com; frame-src https://accounts.google.com https://www.facebook.com https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
