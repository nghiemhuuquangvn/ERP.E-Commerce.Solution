server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — re-resolve every 10s so container restarts don't break routing
    resolver 127.0.0.11 valid=10s;

    # Proxy /api to the Ocelot gateway
    # Using $upstream variable forces per-request DNS resolution (not cached at start)
    location /api/ {
        set $upstream "gateway:5000";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Vue SPA routing — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
