server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver address is injected at container start by docker-entrypoint.sh
    # (differs between Docker Compose's embedded DNS and Kubernetes' CoreDNS)
    resolver ${DNS_RESOLVER} valid=10s;

    # See admin/nginx.docker.conf for why this is needed — JWT permission claims
    # can exceed nginx's 8KB default header buffer.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;

    # Proxy /api to the Ocelot gateway
    # Using $upstream variable forces per-request DNS resolution (not cached at start)
    location /api/ {
        set $upstream "${GATEWAY_HOST}:5000";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Vue SPA routing — fall back to index.html

    # SignalR hub (/hubs/chat) — same origin as the app, WebSocket upgrade, straight to the
    # service: the hub authenticates the JWT/ticket itself.
    location /hubs/chat {
        set $upstream "${CHATBOT_HOST}:5017";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hubs bypass the Gateway: drop client-sent tenant/user headers (only the Gateway sets them).
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Tenant-Code "";
        proxy_set_header X-Tenant-Name "";
        proxy_set_header X-User-Id "";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
