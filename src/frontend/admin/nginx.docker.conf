server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver address is injected at container start by docker-entrypoint.sh
    # (differs between Docker Compose's embedded DNS and Kubernetes' CoreDNS)
    resolver ${DNS_RESOLVER} valid=10s;

    # The JWT's "permission" claim now embeds the full per-tenant permission set
    # (244+ codes for SuperAdmin) instead of a short list — the Authorization
    # header alone is ~10KB, well past nginx's 8KB default `large_client_header_buffers`,
    # which otherwise rejects every authenticated request with a bare
    # "400 Request Header Or Cookie Too Large" (no application code ever runs).
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;

    # Proxy /api to the Ocelot gateway (inter-container DNS)
    # Using $upstream variable forces per-request DNS resolution (not cached at start)
    location /api/ {
        set $upstream "${GATEWAY_HOST}:5000";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Several admin API clients (tenants/users/roles/permissions/settings/*/
    # masterdata/logs/license — see GATEWAY_ROOT usage under src/api) build
    # root-relative URLs like /id/api/... instead of /api/id/api/..., to match
    # Ocelot's per-service route prefixes directly. Proxy those prefixes too,
    # or every one of those pages 404s (silently falls through to the SPA
    # fallback below and serves index.html instead of JSON).
    location ~ ^/(id|po|so|wh|acc|crm|hrm|mst|prd|pay|shp|pos|prm|ntf|rpt|logs)/api/ {
        set $upstream "${GATEWAY_HOST}:5000";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # OpenIddict's OAuth2/OIDC endpoints (discovery, JWKS, authorize/token/userinfo)
    # live at the app root on IdentityService, not under any /api/ prefix — same
    # "falls through to the SPA fallback and serves index.html instead" failure mode
    # as the /id/api/ block above if this isn't proxied too.
    location ~ ^/(\.well-known|connect)/ {
        set $upstream "${GATEWAY_HOST}:5000";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # React SPA routing — fall back to index.html

    # SignalR hub (/hubs/notifications) — same origin as the app, WebSocket upgrade, straight to the
    # service: the hub authenticates the JWT/ticket itself.
    location /hubs/notifications {
        set $upstream "${NOTIFICATION_HOST}:5013";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hubs bypass the Gateway: drop client-sent tenant/user headers (only the Gateway sets them).
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Tenant-Code "";
        proxy_set_header X-Tenant-Name "";
        proxy_set_header X-User-Id "";
        proxy_read_timeout 3600s;
    }

    # SignalR hub (/hubs/chat) — same origin as the app, WebSocket upgrade, straight to the
    # service: the hub authenticates the JWT/ticket itself.
    location /hubs/chat {
        set $upstream "${CHATBOT_HOST}:5017";
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hubs bypass the Gateway: drop client-sent tenant/user headers (only the Gateway sets them).
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-Tenant-Code "";
        proxy_set_header X-Tenant-Name "";
        proxy_set_header X-User-Id "";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
