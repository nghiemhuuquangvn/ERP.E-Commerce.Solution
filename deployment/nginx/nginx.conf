events {
    worker_connections 1024;
}

# Tenant = request host (see docs/business/Identity/MultiTenantLogin.md):
#   <tenant>.erp.local        -> Admin SPA      (platform/SYSTEM tenant: admin.erp.local)
#   <tenant>.shop.erp.local   -> Storefront SPA
#   any other host (a tenant's custom domain registered in TenantDomains) -> Storefront
# Each SPA container serves the app AND proxies /api, /<svc>/api, /connect, /.well-known
# and /hubs/* on the SAME host, keeping the Host header — that is how the Gateway knows
# the tenant. There is deliberately no separate API host (api.erp.local was removed: a
# host that belongs to no tenant can't carry tenant requests).
#
# Message-broker UIs (RabbitMQ management, kafka-ui) are NOT published here any more;
# reach them only from the machine running Docker (ports bound to 127.0.0.1).

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket upgrade for the SignalR hubs proxied by the SPA containers.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Storefront ── <tenant>.shop.erp.local (regex listed first: more specific) ───
    server {
        listen 80;
        server_name ~^[a-z0-9-]+\.shop\.erp\.local$;

        location / {
            proxy_pass http://storefront:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            client_max_body_size 10m;
        }
    }

    # ── Admin ── <tenant>.erp.local, admin.erp.local (platform) ────────────────────
    server {
        listen 80;
        server_name ~^[a-z0-9-]+\.erp\.local$;

        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://admin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            client_max_body_size 10m;
        }
    }

    # ── Custom tenant domains (default) -> Storefront ──────────────────────────────
    # Unknown hosts still reach the Gateway, which answers 404 "Unknown tenant host".
    server {
        listen 80 default_server;
        server_name _;

        large_client_header_buffers 4 32k;

        location / {
            proxy_pass http://storefront:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            client_max_body_size 10m;
        }
    }
}
