events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── ERP Admin Dashboard ── erp.local ───────────────────────────────────────
    server {
        listen 80;
        server_name erp.local;

        location / {
            proxy_pass http://admin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── E-Commerce Storefront ── shop.erp.local ────────────────────────────────
    server {
        listen 80;
        server_name shop.erp.local;

        location / {
            proxy_pass http://storefront:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── API Gateway ── api.erp.local ───────────────────────────────────────────
    server {
        listen 80;
        server_name api.erp.local;

        location / {
            proxy_pass http://gateway:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            client_max_body_size 10m;
        }
    }

    # ── RabbitMQ Management ── rabbit.erp.local ────────────────────────────────
    server {
        listen 80;
        server_name rabbit.erp.local;

        location / {
            proxy_pass http://rabbitmq:15672;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── Kafka UI ── kafka.erp.local ────────────────────────────────────────────
    server {
        listen 80;
        server_name kafka.erp.local;

        location / {
            proxy_pass http://kafka-ui:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── Default (port 80 without domain) ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 200 'ERP Platform running. Use erp.local / shop.erp.local / api.erp.local';
            add_header Content-Type text/plain;
        }
    }
}
