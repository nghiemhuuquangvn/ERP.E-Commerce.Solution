# One-shot PostgreSQL migration Job (ManufacturingDB, src/Database/Manufacturing). Run by
# .github/workflows/db-migrations.yml after db-migrate (same placeholders __IMAGE__ / __RUN__).
# Uses the in-cluster StatefulSet "postgres" (deployment/k8s/infrastructure/postgres.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-migrate-__RUN__
  namespace: erp
  labels:
    app: pg-migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: pg-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: pg-migrate
        image: __IMAGE__
        env:
        - name: PG_HOST
          value: "postgres"
        - name: PG_PORT
          value: "5432"
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: pg-user
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: pg-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
