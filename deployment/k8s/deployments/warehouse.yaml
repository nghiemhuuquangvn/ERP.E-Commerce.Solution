apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehouse-service
  template:
    metadata:
      labels:
        app: warehouse-service
    spec:
      containers:
      - name: warehouse-service
        image: erp/warehouse-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5004
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        # /internal endpoints: only these services' tokens (verified with their JWKS).
        - name: ServiceAuth__Name
          value: "warehouse"
        - name: ServiceAuth__TrustedCallers__salesorder
          value: "http://salesorderservice:5002/internal/jwks.json"
        - name: ASPNETCORE_URLS
          value: "http://+:5004"
        - name: Cache__InstanceName
          value: "wh"
        - name: ConnectionStrings__WarehouseDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-warehouse-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: warehouseservice
  namespace: erp
spec:
  selector:
    app: warehouse-service
  ports:
  - port: 5004
    targetPort: 5004
