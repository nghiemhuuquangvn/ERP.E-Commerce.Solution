apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      containers:
      - name: promotion-service
        image: erp/promotion-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5012
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        # /internal endpoints: only these services' tokens (verified with their JWKS).
        - name: ServiceAuth__Name
          value: "promotion"
        - name: ServiceAuth__TrustedCallers__salesorder
          value: "http://salesorderservice:5002/internal/jwks.json"
        - name: ASPNETCORE_URLS
          value: "http://+:5012"
        - name: Cache__InstanceName
          value: "prm"
        - name: ConnectionStrings__PromotionDb
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-promotion-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5012
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5012
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: promotionservice
  namespace: erp
spec:
  selector:
    app: promotion-service
  ports:
  - port: 5012
    targetPort: 5012
