apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-service
  template:
    metadata:
      labels:
        app: crm-service
    spec:
      containers:
      - name: crm-service
        image: erp/crm-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5006
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5006"
        - name: Cache__InstanceName
          value: "crm"
        - name: ConnectionStrings__CrmDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-crm-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: crmservice
  namespace: erp
spec:
  selector:
    app: crm-service
  ports:
  - port: 5006
    targetPort: 5006
