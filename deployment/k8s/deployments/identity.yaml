apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        # Azure Workload Identity: the pod gets a token for the ServiceAccount's managed
        # identity — used by DefaultAzureCredential to read the signing certificate.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: identity-service
      containers:
      - name: identity-service
        image: erp/identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        # /internal endpoints: only these services' tokens (verified with their JWKS).
        - name: ServiceAuth__Name
          value: "identity"
        - name: ServiceAuth__TrustedCallers__gateway
          value: "http://gateway:5000/internal/jwks.json"
        - name: ServiceAuth__TrustedCallers__chatbot
          value: "http://chatbotservice:5017/internal/jwks.json"
        - name: ASPNETCORE_URLS
          value: "http://+:5001"
        - name: Cache__InstanceName
          value: "identity"
        - name: ConnectionStrings__AuthDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-auth-db
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: jwt-signing-key
        # RS256 signing certificate from Azure Key Vault — the private key never leaves
        # IdentityService. Rotation + HS256 cutover: docs/business/Identity/SigningKeys.md.
        - name: SigningKeys__Source
          value: "KeyVault"
        - name: SigningKeys__KeyVault__VaultUri
          value: "https://<your-key-vault>.vault.azure.net/"
        - name: SigningKeys__KeyVault__CertificateName
          value: "identity-token-signing"
        # Cutover step 1: keep "Hmac" until every service runs the JWKS-capable release,
        # then set "Rsa" (step 2). Release 2 removes the legacy key from the other services.
        - name: Jwt__AccessTokenSigning
          value: "Hmac"
        - name: Security__SettingsEncryptionKey
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: settings-encryption-key
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
  namespace: erp
spec:
  selector:
    app: identity-service
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-service
  namespace: erp
  annotations:
    # Client id of the managed identity granted certificates/list + secrets/get on the vault.
    azure.workload.identity/client-id: "<managed-identity-client-id>"
