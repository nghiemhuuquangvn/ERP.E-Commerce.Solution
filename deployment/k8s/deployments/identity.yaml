apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: erp/identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5001"
        - name: Cache__InstanceName
          value: "identity"
        - name: ConnectionStrings__AuthDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-auth-db
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: jwt-signing-key
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
  namespace: erp
spec:
  selector:
    app: identity-service
  ports:
  - port: 5001
    targetPort: 5001
