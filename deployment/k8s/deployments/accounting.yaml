apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounting-service
  template:
    metadata:
      labels:
        app: accounting-service
    spec:
      containers:
      - name: accounting-service
        image: erp/accounting-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5005
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5005"
        - name: Cache__InstanceName
          value: "acc"
        - name: ConnectionStrings__AccountingDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-accounting-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: jwt-signing-key
        readinessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: accountingservice
  namespace: erp
spec:
  selector:
    app: accounting-service
  ports:
  - port: 5005
    targetPort: 5005
