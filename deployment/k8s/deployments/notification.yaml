apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: erp/notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5013
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5013"
        - name: Cache__InstanceName
          value: "ntf"
        - name: ConnectionStrings__NotificationDb
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-notification-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5013
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5013
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: erp
spec:
  selector:
    app: notification-service
  ports:
  - port: 5013
    targetPort: 5013
