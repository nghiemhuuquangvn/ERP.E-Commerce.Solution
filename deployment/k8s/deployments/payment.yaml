apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: erp/payment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5009
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5009"
        - name: Cache__InstanceName
          value: "pay"
        - name: ConnectionStrings__PaymentDb
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-payment-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        - name: Security__SettingsEncryptionKey
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: settings-encryption-key
        readinessProbe:
          httpGet:
            path: /health
            port: 5009
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5009
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: erp
spec:
  selector:
    app: payment-service
  ports:
  - port: 5009
    targetPort: 5009
