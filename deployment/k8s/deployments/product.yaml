apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: erp/product-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5008
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5008"
        - name: Cache__InstanceName
          value: "prd"
        - name: ConnectionStrings__ProductDB
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-product-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5008
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5008
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: erp
spec:
  selector:
    app: product-service
  ports:
  - port: 5008
    targetPort: 5008
