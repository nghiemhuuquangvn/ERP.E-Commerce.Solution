apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterdata-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: masterdata-service
  template:
    metadata:
      labels:
        app: masterdata-service
    spec:
      containers:
      - name: masterdata-service
        image: erp/masterdata-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5015
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5015"
        # /internal endpoints: only these services' tokens (verified with their JWKS).
        - name: ServiceAuth__Name
          value: "masterdata"
        - name: ServiceAuth__TrustedCallers__accounting
          value: "http://accountingservice:5005/internal/jwks.json"
        - name: Cache__InstanceName
          value: "mst"
        - name: ConnectionStrings__MasterDataDb
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-masterdata-db
        readinessProbe:
          httpGet:
            path: /health
            port: 5015
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5015
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: masterdataservice
  namespace: erp
spec:
  selector:
    app: masterdata-service
  ports:
  - port: 5015
    targetPort: 5015
