apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        image: erp/admin:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: erp
spec:
  selector:
    app: admin
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30300
---
