apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesorder-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salesorder-service
  template:
    metadata:
      labels:
        app: salesorder-service
        # Azure Workload Identity — DefaultAzureCredential reads this service's
        # token signing certificate from Key Vault.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: salesorder-service
      containers:
      - name: salesorder-service
        image: erp/salesorder-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        # Service-to-service tokens signed with this service's own Key Vault certificate
        # (several replicas share it — never Ephemeral here).
        - name: ServiceAuth__Name
          value: "salesorder"
        - name: ServiceAuth__SigningKeys__Source
          value: "KeyVault"
        - name: ServiceAuth__SigningKeys__KeyVault__VaultUri
          value: "https://<your-key-vault>.vault.azure.net/"
        - name: ServiceAuth__SigningKeys__KeyVault__CertificateName
          value: "svc-salesorder-signing"
        - name: Services__WarehouseServiceBaseUrl
          value: "http://warehouseservice:5004"
        - name: Services__PromotionServiceBaseUrl
          value: "http://promotionservice:5012"
        - name: ASPNETCORE_URLS
          value: "http://+:5002"
        - name: Cache__InstanceName
          value: "so"
        - name: ConnectionStrings__SalesDb
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: sql-sales-db
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: rabbitmq-password
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: salesorderservice
  namespace: erp
spec:
  selector:
    app: salesorder-service
  ports:
  - port: 5002
    targetPort: 5002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: salesorder-service
  namespace: erp
  annotations:
    # Managed identity with certificates/list + secrets/get on the service-signing certificate.
    azure.workload.identity/client-id: "<managed-identity-client-id>"
