# Requires nginx ingress controller: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.0/deploy/static/provider/cloud/deploy.yaml
#
# Tenant = request host (docs/business/Identity/MultiTenantLogin.md, SecurityReview-2026-10.md):
#   <tenant>.erp.local       -> admin       (platform/SYSTEM tenant: admin.erp.local)
#   <tenant>.shop.erp.local  -> storefront
#   custom tenant domains    -> storefront  (add one rule per domain, or a default backend)
# The SPA containers proxy /api, /<svc>/api, /connect, /.well-known and the SignalR hubs
# (/hubs/chat, /hubs/notifications) on the SAME host with the Host header intact — the
# Gateway resolves the tenant from it. Removed on purpose (2026-10-20):
#   api.erp.local            — a host that belongs to no tenant can't carry tenant requests;
#   chat./notifications.     — hubs are same-origin now;
#   rabbit./kafka.erp.local  — broker admin UIs must not be public (kubectl port-forward).
# No rewrite-target: paths are forwarded unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-ingress
  namespace: erp
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
spec:
  ingressClassName: nginx
  defaultBackend:
    service:
      name: storefront
      port:
        number: 80
  rules:
  # Wildcard matches exactly one label, so it never swallows *.shop.erp.local.
  - host: "*.shop.erp.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storefront
            port:
              number: 80
  - host: "*.erp.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 80
