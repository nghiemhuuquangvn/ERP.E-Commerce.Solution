# PostgreSQL for ManufacturingService only (every other service uses SQL Server). The database ManufacturingDB is created and
# migrated by the job below (src/Database/Manufacturing/*.sql, idempotent) - run it after the StatefulSet is ready and
# whenever a Manufacturing migration is added. Credentials: erp-secrets keys pg-user / pg-password.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: erp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: pg-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: pg-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: [sh, -c, "pg_isready -U $POSTGRES_USER -d postgres"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [sh, -c, "pg_isready -U $POSTGRES_USER -d postgres"]
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: erp
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
